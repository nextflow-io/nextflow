name: Bundle
# Builds the standalone bundle (Java runtime, jar and AOT cache) of each platform on a native
# runner, since the AOT cache can only be created by the target runtime, and tests it.
# The release (build.yml) calls this workflow and uploads the bundles with the other release
# files, from the artifacts `bundle-<platform>` (`.tar.gz` and `.tar.gz.sha256`).
# bundle-pr.yml calls it for each pull request.
# No Gradle cache: on a PR, it would be saved first, without the test dependencies, under the
# key that the CI build (build.yml) of the PR restores.

# Not run on pushes to master: the release builds the bundles of every release commit.
on:
  workflow_dispatch:
    inputs:
      jre-version:
        description: 'Temurin JRE release, e.g. 25.0.5+8 (default: the latest Temurin 25 release)'
        required: false
        type: string
  workflow_call:
    inputs:
      jre-version:
        description: 'Temurin JRE release, e.g. 25.0.5+8 (default: the latest Temurin 25 release)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # all the bundles of a version must have the same runtime, which is resolved once
  jre:
    name: Resolve the Java runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Resolve the Temurin JRE
        id: resolve
        env:
          JRE_VERSION: ${{ inputs.jre-version }}
        run: |
          ./gradlew --console=plain jreRelease ${JRE_VERSION:+"-PjreVersion=$JRE_VERSION"}
          version=$(jq -r .version build/jre/release.json)
          echo "Temurin JRE: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle (${{ matrix.target }})
    needs: jre
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      JRE_VERSION: ${{ needs.jre.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'

      # the build info of the jar, as in the jar of the release (`make assemble`)
      - name: Build bundle
        run: |
          ./gradlew --console=plain buildInfo
          ./gradlew --console=plain bundle "-PjreVersion=$JRE_VERSION"

      - name: Extract bundle
        run: |
          dir=$(mktemp -d)
          tarball=$(ls build/bundle/*.tar.gz)
          tar -xzf "$tarball" -C "$dir"
          echo "BUNDLE_HOME=$dir/$(basename "$tarball" .tar.gz)" >> "$GITHUB_ENV"

      # HTTPS with the trust store of the OS (the macOS keychain or the Java trust store of the Linux distro)
      - name: HTTPS test
        run: |
          dir=$(mktemp -d)
          cat > "$dir/main.nf" <<'EOF'
          workflow {
              println file('https://raw.githubusercontent.com/nextflow-io/nextflow/master/VERSION').text.trim()
          }
          EOF
          cd "$dir"
          NXF_HOME=$dir/home "$BUNDLE_HOME/bin/nextflow" run main.nf

      # the installed launcher downloads the bundle from a mirror with the layout of the release server,
      # and hands off to it; on linux-x64, a subset of the integration tests also runs through it
      - name: Hand-off test
        env:
          TEST_JDK: '25'
        run: |
          tests=()
          if [ "$TARGET" = linux-x64 ]; then
            cd tests/checks
            tests=(bash run.sh '../basic.nf ../custom-lib.nf ../collect-file.nf ../config-vars.nf ../each-file.nf ../error.nf ../task-retry.nf ../publish-dir.nf ../workflow-oncomplete.nf ../subworkflow.nf ../topic-channel.nf ../template-simple.nf ../cli-args.nf ../profiles.nf ../inspect-json.nf ../resume-retried-task.nf')
          fi
          "$GITHUB_WORKSPACE/bundle/test-handoff.sh" "$(ls "$GITHUB_WORKSPACE"/build/bundle/*.tar.gz)" "$RUNNER_TEMP/handoff" "${tests[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: build/bundle/*.tar.gz*
          if-no-files-found: error
          retention-days: 30

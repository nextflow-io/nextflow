name: Bundle
# Builds the standalone bundle (Java runtime, jar and AOT cache) of each platform on a native
# runner, since the AOT cache can only be created by the target runtime, and smoke-tests it.
# When run manually for a version, attaches the bundles to the GitHub release of that version.

on:
  push:
    branches:
      - 'master'
    paths:
      - 'nextflow'
      - 'bundle/**'
      - 'gradle/bundle.gradle'
      - '.github/workflows/bundle.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'nextflow'
      - 'bundle/**'
      - 'gradle/bundle.gradle'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 26.10.4 (the bundles are built from the tag v<version> and attached to its release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - name: Check version
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$(cat VERSION)" != "$INPUT_VERSION" ]; then
            echo "VERSION file ($(cat VERSION)) does not match the requested version ($INPUT_VERSION)"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: gradle

      - name: Build bundle
        env:
          # for the Corretto release notes (GitHub API rate limit)
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make bundle
          cd build/bundle
          for f in *.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      # the bundle must work when extracted anywhere, with the AOT cache
      - name: Smoke test
        run: |
          dir=$(mktemp -d)
          tarball=$(ls build/bundle/*.tar.gz)
          tar -xzf "$tarball" -C "$dir"
          home=$dir/$(basename "$tarball" .tar.gz)
          test -s "$home/lib/nextflow.aot"
          "$home/runtime/bin/java" -version
          # -XX:AOTMode=on: the JVM fails to start if the cache is rejected
          NXF_JVM_ARGS=-XX:AOTMode=on bundle/train.sh --verify "$home" "$dir/work"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: build/bundle/*.tar.gz*
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      # the release is created by the release process; re-running replaces the bundles
      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: gh release upload "$TAG" dist/* --clobber

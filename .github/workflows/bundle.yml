name: Bundle
# Builds the standalone bundle (Java runtime, jar and AOT cache) of each platform on a native
# runner, since the AOT cache can only be created by the target runtime, and tests it.
# The release (build.yml) calls this workflow and uploads the bundles with the other release
# files, from the artifacts `bundle-<platform>` (`.tar.gz` and `.tar.gz.sha256`).

on:
  push:
    branches:
      - 'master'
    paths:
      - 'nextflow'
      - 'bundle/**'
      - 'gradle/bundle.gradle'
      - '.github/workflows/bundle.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'nextflow'
      - 'bundle/**'
      - 'gradle/bundle.gradle'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:
    inputs:
      jre-version:
        description: 'Temurin JRE release, e.g. 25.0.5+8 (default: the latest Temurin 25 release)'
        required: false
        type: string
  workflow_call:
    inputs:
      jre-version:
        description: 'Temurin JRE release, e.g. 25.0.5+8 (default: the latest Temurin 25 release)'
        required: false
        type: string
    outputs:
      jre-version:
        description: 'The Temurin JRE release of the bundles'
        value: ${{ jobs.jre.outputs.version }}

permissions:
  contents: read

# runs called by the release are never cancelled, nor queued behind other runs
concurrency:
  group: bundle-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # all the bundles of a version must have the same runtime, which is resolved once
  jre:
    name: Resolve the Java runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: gradle

      - name: Resolve the Temurin JRE
        id: resolve
        env:
          JRE_VERSION: ${{ inputs.jre-version }}
        run: |
          ./gradlew --console=plain jreRelease ${JRE_VERSION:+"-PjreVersion=$JRE_VERSION"}
          version=$(jq -r .version build/jre/release.json)
          echo "Temurin JRE: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle (${{ matrix.target }})
    needs: jre
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      JRE_VERSION: ${{ needs.jre.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: gradle

      # the build info of the jar, as in the jar of the release (`make assemble`)
      - name: Build bundle
        run: |
          ./gradlew --console=plain buildInfo
          ./gradlew --console=plain bundle "-PjreVersion=$JRE_VERSION"

      # the bundle must work when extracted anywhere, with the AOT cache
      - name: Smoke test
        run: |
          (cd build/bundle && shasum -a 256 -c ./*.sha256)
          dir=$(mktemp -d)
          tarball=$(ls build/bundle/*.tar.gz)
          tar -xzf "$tarball" -C "$dir"
          home=$dir/$(basename "$tarball" .tar.gz)
          test -s "$home/lib/nextflow.aot"
          "$home/runtime/bin/java" -version
          # -XX:AOTMode=on: the JVM fails to start if the cache is rejected
          NXF_JVM_ARGS=-XX:AOTMode=on bundle/train.sh --verify "$home" "$dir/work"
          echo "BUNDLE_HOME=$home" >> "$GITHUB_ENV"

      # HTTPS with the trust store of the OS (the macOS keychain or the Java trust store of the Linux distro)
      - name: HTTPS test
        run: |
          dir=$(mktemp -d)
          cat > "$dir/main.nf" <<'EOF'
          workflow {
              println file('https://raw.githubusercontent.com/nextflow-io/nextflow/master/VERSION').text.trim()
          }
          EOF
          cd "$dir"
          NXF_HOME=$dir/home "$BUNDLE_HOME/bin/nextflow" run main.nf

      # the installed launcher downloads the bundle from a mirror with the layout of the release server,
      # and hands off to it; on linux-x64, a subset of the integration tests also runs through it
      - name: Hand-off test
        env:
          TEST_JDK: '25'
        run: |
          tests=()
          if [ "$TARGET" = linux-x64 ]; then
            cd tests/checks
            tests=(bash run.sh '../basic.nf ../custom-lib.nf ../collect-file.nf ../config-vars.nf ../each-file.nf ../error.nf ../task-retry.nf ../publish-dir.nf ../workflow-oncomplete.nf ../subworkflow.nf ../topic-channel.nf ../template-simple.nf ../cli-args.nf ../profiles.nf ../inspect-json.nf ../resume-retried-task.nf')
          fi
          "$GITHUB_WORKSPACE/bundle/test-handoff.sh" "$(ls "$GITHUB_WORKSPACE"/build/bundle/*.tar.gz)" "$RUNNER_TEMP/handoff" "${tests[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: build/bundle/*.tar.gz*
          if-no-files-found: error

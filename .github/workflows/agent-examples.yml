name: Agent examples
# End-to-end validation of examples/agents/* against the nf-agent-pi runner image built from
# THIS tree.
#
# The plugin jar names its runner image by the plugin VERSION, which is bumped only at release,
# so between a build-context change and its release the image the jar declares is the PREVIOUS
# build - and the new one exists nowhere a Wave or k8s run could pull it from. This lane breaks
# that loop: it publishes the image under a tag derived from the checksum of its build context
# (`build-image.sh context-tag`) to the staging registry, then runs the examples against it.
# The tag is content-addressed, so it is published once per build context and re-used by every
# later run that does not change it.
#
# Initial scope: the first three examples, local executor only. They call a real model, hence
# the path filter and no fork PRs, which get no secrets.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'plugins/nf-agent-pi/**'
      - 'plugins/nf-agent/**'
      - 'modules/nextflow/src/main/groovy/nextflow/agent/**'
      - 'examples/agents/**'
      - '.github/workflows/agent-examples.yml'
  push:
    branches:
      - 'master'
    paths:
      - 'plugins/nf-agent-pi/**'
      - 'plugins/nf-agent/**'
      - 'modules/nextflow/src/main/groovy/nextflow/agent/**'
      - 'examples/agents/**'
      - '.github/workflows/agent-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STAGE_REGISTRY: public.cr.stage-seqera.io
  STAGE_NAMESPACE: public.cr.stage-seqera.io/nextflow

jobs:
  image:
    name: Runner image
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # sized for a cold multi-arch build: the arm64 leg runs `apt-get` and `npm ci` under QEMU
    timeout-minutes: 45
    outputs:
      image: ${{ steps.coordinate.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the image coordinate
        id: coordinate
        run: |
          tag=$(plugins/nf-agent-pi/build-image.sh context-tag)
          echo "image=$STAGE_NAMESPACE/nf-agent-pi:$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "runner image: $STAGE_NAMESPACE/nf-agent-pi:$tag"

      - name: Docker Login to Seqera stage CR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.STAGE_REGISTRY }}
          username: ${{ vars.SEQERA_STAGE_CR_USERNAME }}
          password: ${{ secrets.SEQERA_STAGE_CR_PASSWORD }}

      # A content-addressed tag that is already published IS this build context: skip the QEMU
      # setup and the build altogether. `build-image.sh push` would skip it too, but only after
      # the QEMU step below had already paid for itself. Published means BOTH platforms - a
      # single-arch leftover falls through to the push, which reports it.
      - name: Check whether the image is already published
        id: probe
        env:
          IMAGE: ${{ steps.coordinate.outputs.image }}
        run: |
          manifest=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null || true)
          if grep -Eq 'Platform:[[:space:]]+linux/amd64$' <<< "$manifest" \
             && grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?$' <<< "$manifest"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is already published - nothing to build"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Before QEMU, as in the release job: setup-qemu-action pulls tonistiigi/binfmt from
      # Docker Hub, and an anonymous pull from a shared runner IP hits `toomanyrequests`.
      - name: Docker Login to Docker Hub
        if: ${{ steps.probe.outputs.published != 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU for the runner image build
        if: ${{ steps.probe.outputs.published != 'true' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      # Both architectures, as the release builds it: developers on arm64 pull the same tag.
      - name: Build and push the runner image
        if: ${{ steps.probe.outputs.published != 'true' }}
        env:
          TAG: ${{ steps.coordinate.outputs.tag }}
        run: plugins/nf-agent-pi/build-image.sh push -r "$STAGE_NAMESPACE" -t "$TAG"

  examples:
    name: Examples (local)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: 'corretto'
          architecture: x64
          cache: gradle

      - name: Docker Login to Seqera stage CR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.STAGE_REGISTRY }}
          username: ${{ vars.SEQERA_STAGE_CR_USERNAME }}
          password: ${{ secrets.SEQERA_STAGE_CR_PASSWORD }}

      - name: Compile
        run: make compile assemble

      - name: Run the agent examples
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ./examples/agents/validate.sh -m local -r -i "$IMAGE" \
            01_structured-output 02_two-agents 03_skills

      - name: Publish the validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-validation
          path: |
            build/agent-validation/**/console.log
            build/agent-validation/**/resume.log
            build/agent-validation/**/*.nextflow.log
            build/agent-validation/**/.nextflow.log
            build/agent-validation/**/answer-*.txt
            build/agent-validation/agent-image.config
          include-hidden-files: true
          if-no-files-found: ignore

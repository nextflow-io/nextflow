name: Release
# Publishes a release: builds the Java bundles of every platform (bundle.yml), then runs
# release.sh, which uploads them with the other release files.
# build.yml calls it for [release] commits on master and STABLE-* branches, once the build
# and the tests have passed.

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      SEQERA_PUBLIC_CR_PASSWORD:
        required: true
      SEQERA_MAVEN_SECRET_KEY:
        required: true
      NPR_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  # The caller decides whether to release. These jobs check their status explicitly, so that
  # its `test` job, skipped on `[ci fast]` release commits, can't skip them too.
  bundle:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/bundle.yml
    with:
      # empty for the latest Temurin release
      jre-version: ${{ vars.NXF_BUNDLE_JRE_VERSION }}
    permissions:
      contents: read

  release:
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    needs: bundle
    runs-on: ubuntu-24.04
    # a ceiling for the emulated arm64 nf-agent-pi image build: a timeout mid-release.sh is not harmless
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write  # OIDC token to assume the AWS release role
    steps:
      # persists credentials on purpose: the `release` task in packing.gradle pushes the version tag
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      # uploaded by `deploy` (release.sh step 2), see NXF_RELEASE_BUNDLES below
      - name: Download the Java bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: 17
          distribution: 'corretto'
          architecture: x64
          cache: gradle

      - name: Configure Git
        env:
          GIT_USER_NAME: ${{ github.event.pusher.name || github.actor }}
          GIT_USER_EMAIL: ${{ github.event.pusher.email || format('{0}@users.noreply.github.com', github.actor) }}
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

      - name: Docker Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # also authorizes the nf-agent-pi image push of release.sh
      - name: Docker Login to Seqera public CR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: "public.cr.seqera.io"
          username: ${{ vars.SEQERA_PUBLIC_CR_USERNAME }}
          password: ${{ secrets.SEQERA_PUBLIC_CR_PASSWORD }}

      # The arm64 leg of the nf-agent-pi image build runs under emulation. After the Docker Hub login,
      # since anonymous pulls of the binfmt image are rate limited. build-image.sh creates its own builder.
      - name: Set up QEMU for the runner image build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4.4.0
        with:
          # pinned, the default is a floating `latest`
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      # Credentials to publish the release files, as step outputs only: in the environment, the
      # session token would be paired with the static Maven keys of `Run release` and break them.
      - name: Assume AWS release role
        id: aws_release_role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # ratchet:aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.SEQERA_NEXTFLOW_RELEASE_ROLE_ARN }}
          aws-region: eu-west-1
          output-credentials: true
          output-env-credentials: false

      - name: Run release
        run: |
          echo "Starting release process..."
          echo "npr.apiUrl=$NPR_API_URL" >> gradle.properties
          echo "npr.apiKey=$NPR_API_KEY" >> gradle.properties
          bash release.sh
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
          AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: 'true'
          # temporary credentials (assumed role) to publish nextflow assets
          NXF_AWS_ACCESS: ${{ steps.aws_release_role.outputs.aws-access-key-id }}
          NXF_AWS_SECRET: ${{ steps.aws_release_role.outputs.aws-secret-access-key }}
          NXF_AWS_SESSION_TOKEN: ${{ steps.aws_release_role.outputs.aws-session-token }}
          # credentials to publish maven libraries
          AWS_ACCESS_KEY_ID: ${{ vars.SEQERA_MAVEN_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SEQERA_MAVEN_SECRET_KEY }}
          # plugin registry
          NPR_API_URL: ${{ vars.NPR_API_URL }}
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
          # Java bundles of each platform, built by the `bundle` job
          NXF_RELEASE_BUNDLES: ${{ runner.temp }}/bundles
          # for the error messages of build-image.sh, the push uses the login above
          SEQERA_PUBLIC_CR_USERNAME: ${{ vars.SEQERA_PUBLIC_CR_USERNAME }}
          SEQERA_PUBLIC_CR_PASSWORD: ${{ secrets.SEQERA_PUBLIC_CR_PASSWORD }}
          # GitHub secrets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

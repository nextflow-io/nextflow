name: 'Clean up Azure test storage'
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be deleted'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    # secrets are only available in the upstream repository
    if: ${{ github.repository == 'nextflow-io/nextflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install 'azure-storage-blob>=12.19,<13'

      # empties the `my-data` container and deletes the `nf-az-blob-*` containers leaked by tests;
      # scheduled runs delete for real, manual runs default to a dry run
      - name: Clean up storage account
        run: |
          python3 .github/scripts/azure-storage-cleanup.py --empty my-data --max-age-hours 24 \
            ${{ (github.event_name == 'schedule' || inputs.dry_run == false) && '--delete' || '' }}
        env:
          AZURE_STORAGE_ACCOUNT_NAME: nfazurestore
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}

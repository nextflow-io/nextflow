name: cffconvert

on:
  push:
    paths:
      - CITATION.cff

permissions:
  contents: read

jobs:
  validate:
    name: "validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the citation metadata from CITATION.cff is valid
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # ratchet:citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

plugins {
    id 'io.nextflow.nextflow-plugin' version "${nextflowPluginVersion}"
    id 'java-test-fixtures'
}

nextflowPlugin {
    nextflowVersion = '26.09.0-edge'

    provider = "${nextflowPluginProvider}"
    description = 'Provides comprehensive AWS cloud integration including Batch executor, S3 file system, and Fusion support for high-performance data operations'
    className = 'nextflow.cloud.aws.AmazonPlugin'
    useDefaultDependencies = false
    generateSpec = false
    extensionPoints = [
        'nextflow.cloud.aws.batch.AwsBatchExecutor',
        'nextflow.cloud.aws.config.AwsConfig',
        'nextflow.cloud.aws.fusion.AwsFusionEnv',
        'nextflow.cloud.aws.mail.AwsMailProvider',
        'nextflow.cloud.aws.nio.S3AtomicLockProvider',
        'nextflow.cloud.aws.nio.S3ObjectStoreReader',
        'nextflow.cloud.aws.util.S3PathFactory',
        'nextflow.cloud.aws.util.S3PathSerializer',
    ]
}

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = ['src/testResources']
}

configurations {
    // see https://docs.gradle.org/4.1/userguide/dependency_management.html#sub:exclude_transitive_dependencies
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
    testRuntimeClasspath.exclude group: 'io.micronaut', module: 'micronaut-core-bom'
}

dependencies {
    compileOnly project(':nextflow')
    compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "org.pf4j:pf4j:${pf4jVersion}"

    api ("javax.xml.bind:jaxb-api:${jaxbApiVersion}")
    api ("software.amazon.awssdk:s3:${awsSdkVersion}")
    api ("software.amazon.awssdk:ec2:${awsSdkVersion}")
    api ("software.amazon.awssdk:batch:${awsSdkVersion}")
    api ("software.amazon.awssdk:iam:${awsSdkVersion}")
    api ("software.amazon.awssdk:ecs:${awsSdkVersion}")
    api ("software.amazon.awssdk:cloudwatchlogs:${awsSdkVersion}")
    api ("software.amazon.awssdk:codecommit:${awsSdkVersion}")
    api ("software.amazon.awssdk:sts:${awsSdkVersion}")
    api ("software.amazon.awssdk:ses:${awsSdkVersion}")
    api ("software.amazon.awssdk:sso:${awsSdkVersion}")
    api ("software.amazon.awssdk:ssooidc:${awsSdkVersion}")
    api ("software.amazon.awssdk:s3-transfer-manager:${awsSdkVersion}")
    api ("software.amazon.awssdk:apache-client:${awsSdkVersion}")
    api ("software.amazon.awssdk:aws-crt-client:${awsSdkVersion}")

    testImplementation(testFixtures(project(":nextflow")))
    testImplementation project(':nextflow')
    testImplementation "org.apache.groovy:groovy:${groovyVersion}"
    testImplementation "org.apache.groovy:groovy-nio:${groovyVersion}"
    // wiremock required by S3ClientRetryTest: the SDK's retry lives inside the real S3 client, so a
    // mocked client cannot exercise it -- only an HTTP-level stub below the SDK can
    testImplementation "org.apache.groovy:groovy-json:${groovyVersion}" // needed by wiremock
    testImplementation ("org.wiremock:wiremock-standalone:${wiremockVersion}") { exclude module: 'groovy-all' }
}

plugins {
    id 'io.nextflow.nextflow-plugin' version "${nextflowPluginVersion}"
    id 'java-test-fixtures'
}

nextflowPlugin {
    nextflowVersion = '26.08.0-edge'

    provider = "${nextflowPluginProvider}"
    description = 'Enables Azure cloud execution through Batch service with native Blob storage access and comprehensive authentication options'
    className = 'nextflow.cloud.azure.AzurePlugin'
    useDefaultDependencies = false
    generateSpec = false
    extensionPoints = [
        'nextflow.cloud.azure.batch.AzBatchExecutor',
        'nextflow.cloud.azure.config.AzConfig',
        'nextflow.cloud.azure.file.AzPathFactory',
        'nextflow.cloud.azure.file.AzPathSerializer',
        'nextflow.cloud.azure.fusion.AzFusionEnv',
    ]
}

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = ['src/testResources']
    test.resources.srcDirs = []
}

configurations {
    // see https://docs.gradle.org/4.1/userguide/dependency_management.html#sub:exclude_transitive_dependencies
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
    testRuntimeClasspath.exclude group: 'io.micronaut', module: 'micronaut-core-bom'
}

dependencies {
    compileOnly project(':nextflow')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.pf4j:pf4j:3.14.1'
    api('com.azure:azure-storage-blob:12.33.4') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    api('com.azure:azure-compute-batch:1.0.0-beta.6') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.guava', module: 'guava'
    }
    api('com.azure:azure-identity:1.18.5') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    // Force patched jackson on the 2.18 line (required by the Azure SDK) to address
    // GHSA-72hv-8253-57qq (jackson-core DoS) and the jackson-databind deserialization
    // advisories fixed in 2.18.9 (PolymorphicTypeValidator and @JsonView/@JsonIgnore bypasses)
    runtimeOnly 'com.fasterxml.jackson.core:jackson-core:2.18.9'
    runtimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.9'

    // Pin azure-core-http-netty to a version that brings patched netty
    // (4.1.137.Final) to address the netty-codec advisories fixed in 4.1.136.Final,
    // notably GHSA-93wv-jw9v-4972, GHSA-jppx-w49h-x2qq, GHSA-558v-64gr-wgg4 and
    // GHSA-mfg7-5gfp-c4w3 (reference-count leaks, decoder hangs and memory exhaustion)
    implementation 'com.azure:azure-core-http-netty:1.16.6'
    // The netty BOM aligns the whole netty family on the patched release: reactor-netty,
    // pulled in by azure-core-http-netty, otherwise leaves netty-codec-dns and
    // netty-resolver-dns behind on 4.1.135.Final
    implementation platform('io.netty:netty-bom:4.1.137.Final')

    testImplementation(testFixtures(project(":nextflow")))
    testImplementation project(':nextflow')
    testImplementation "org.apache.groovy:groovy:4.0.33"
    testImplementation "org.apache.groovy:groovy-nio:4.0.33"
}

plugins {
    id 'io.nextflow.nextflow-plugin' version "${nextflowPluginVersion}"
    id 'java-test-fixtures'
}

nextflowPlugin {
    nextflowVersion = '26.08.0-edge'

    provider = "${nextflowPluginProvider}"
    description = 'Integrates with Seqera Platform for comprehensive workflow monitoring, resource tracking, and cache management capabilities'
    className = 'io.seqera.plugin.SeqeraPlugin'
    useDefaultDependencies = false
    generateSpec = false
    extensionPoints = [
        'io.seqera.executor.SeqeraExecutor',
        'io.seqera.config.SeqeraConfig'
    ]
}

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = []
}

configurations {
    // see https://docs.gradle.org/4.1/userguide/dependency_management.html#sub:exclude_transitive_dependencies
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
}

dependencies {
    compileOnly project(':nextflow')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.pf4j:pf4j:3.14.1'

    // intelligent compute scheduler client
    api 'io.seqera:sched-client:0.79.3'
    // Single lib-httpx declaration, kept in step with the version sched-client is built
    // against. SchedHxClient overrides shouldRetryOnException(HttpRequest, Throwable), an
    // overload added in 2.6.0: on an older lib-httpx the override binds to nothing and the
    // client silently falls back to retrying every IOException on every request, which
    // re-sends a timed-out batch submit and duplicates the tasks it creates.
    api 'io.seqera:lib-httpx:2.6.0'
    // jackson 2.21.5 addresses GHSA-rmj7-2vxq-3g9f and GHSA-j3rv-43j4-c7qm
    // (PolymorphicTypeValidator bypasses) and later deserialization advisories
    api "com.fasterxml.jackson.core:jackson-databind:2.21.5"

    testImplementation(testFixtures(project(":nextflow")))
    testImplementation "org.apache.groovy:groovy:4.0.33"
    testImplementation "org.apache.groovy:groovy-nio:4.0.33"
}

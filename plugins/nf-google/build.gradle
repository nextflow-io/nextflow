plugins {
    id 'io.nextflow.nextflow-plugin' version "${nextflowPluginVersion}"
    id 'java-test-fixtures'
}

nextflowPlugin {
    nextflowVersion = '26.08.0-edge'

    provider = "${nextflowPluginProvider}"
    description = 'Enables Google Cloud Platform execution through Batch service with native Cloud Storage access and intelligent machine type selection'
    className = 'nextflow.cloud.google.GoogleCloudPlugin'
    useDefaultDependencies = false
    generateSpec = false
    extensionPoints = [
        'nextflow.cloud.google.GoogleOpts',
        'nextflow.cloud.google.batch.GoogleBatchExecutor',
        'nextflow.cloud.google.util.GsPathFactory',
        'nextflow.cloud.google.util.GsPathSerializer',
    ]
}

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = []
}

configurations {
    // see https://docs.gradle.org/4.1/userguide/dependency_management.html#sub:exclude_transitive_dependencies
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
}

dependencies {
    compileOnly project(':nextflow')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.pf4j:pf4j:3.14.1'

    api 'com.google.auth:google-auth-library-oauth2-http:1.39.1'
    api 'com.google.cloud:google-cloud-batch:0.75.0'
    api 'com.google.cloud:google-cloud-logging:3.23.5'
    api 'com.google.cloud:google-cloud-nio:0.128.5'
    api 'com.google.cloud:google-cloud-storage:2.58.0'
    api 'io.seqera:lib-cloudinfo:1.0.0'
    // Override the old lib-httpx pulled transitively by lib-cloudinfo, otherwise the plugin
    // bundles failsafe-3.1.0 which clashes with the failsafe-3.3.2 the plugin is compiled
    // against (java.lang.NoSuchMethodError on handleIf(CheckedPredicate) at runtime).
    api 'io.seqera:lib-httpx:2.7.0'
    // Raise the vulnerable transitive dependencies of the Google SDK across ALL configurations -
    // including testFixtures*, which implementation/runtimeOnly pins never reach. Constraints lift
    // a transitive version without adding a direct dependency edge; `api` scope is what propagates
    // to the consumer and testFixtures* classpaths.
    constraints {
        // jackson stays on the 2.18 line required by the Google SDK; addresses GHSA-72hv-8253-57qq
        // (jackson-core DoS) and the jackson-databind deserialization advisories fixed in 2.18.9
        api('com.fasterxml.jackson.core:jackson-databind:2.18.9') { because 'jackson-databind deserialization CVEs' }
        api('com.fasterxml.jackson.core:jackson-core:2.18.9') { because 'GHSA-72hv-8253-57qq' }
        api('com.fasterxml.jackson.core:jackson-annotations:2.18.9') { because 'keep jackson aligned' }
    }
    // grpc artifacts do not self-align: google-cloud-batch requests grpc-api/core/util/context at
    // 1.71.0 independently of grpc-netty-shaded, so a constraint naming only grpc-netty-shaded
    // leaves the rest of the family behind - and, because a constraint adds no dependency edge,
    // actually DOWNGRADES them relative to the runtimeOnly pin it replaces. The BOM is grpc's own
    // alignment artifact and moves the whole family; `api` so it reaches testFixtures* too.
    // 1.75.0 addresses CVE-2025-55163 (MadeYouReset HTTP/2 DDoS vulnerability).
    api platform('io.grpc:grpc-bom:1.75.0')

    testImplementation(testFixtures(project(":nextflow")))
    testImplementation "org.apache.groovy:groovy:4.0.33"
    testImplementation "org.apache.groovy:groovy-nio:4.0.33"
}

test {
    useJUnitPlatform()
}

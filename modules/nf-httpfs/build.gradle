apply plugin: 'groovy'

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = []
}


dependencies {
    api project(':nf-commons')
    api "ch.qos.logback:logback-classic:${logbackVersion}"
    api "org.apache.groovy:groovy:${groovyVersion}"
    api "org.apache.groovy:groovy-nio:${groovyVersion}"
    api("com.esotericsoftware.kryo:kryo:${kryoVersion}") { exclude group: 'com.esotericsoftware.minlog', module: 'minlog' }

    testImplementation ("org.spockframework:spock-core:${spockVersion}") { exclude group: 'org.apache.groovy' }
    // provides the JUnit 4 @Rule support used by WireMockRule
    testImplementation ("org.spockframework:spock-junit4:${spockVersion}") { exclude group: 'org.apache.groovy' }
    testImplementation "org.apache.groovy:groovy-json:${groovyVersion}" // needed by wiremock
    // needed by Spock to mock classes
    testRuntimeOnly "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
    testRuntimeOnly "org.objenesis:objenesis:${objenesisVersion}"
    testImplementation ("org.wiremock:wiremock-standalone:${wiremockVersion}") { exclude module: 'groovy-all' }
}


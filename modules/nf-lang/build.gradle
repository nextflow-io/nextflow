plugins {
  id 'antlr'
}

compileJava {
  options.compilerArgs << '-parameters'
}

dependencies {
  antlr 'me.sunlan:antlr4:4.13.2.16'
  api "org.apache.groovy:groovy:${groovyVersion}"
  api "org.pf4j:pf4j:${pf4jVersion}"

  testFixturesApi "com.google.jimfs:jimfs:${jimfsVersion}"
  constraints {
    // jimfs pulls a vulnerable Guava, even in its latest release
    testFixturesApi('com.google.guava:guava:33.7.2-jre') { because 'GHSA-xxph-c9ww-hj94' }
  }
  testImplementation(testFixtures(project(":nextflow")))
}

generateGrammarSource {
  arguments += ['-no-listener', '-no-visitor']
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateGrammarSource')
}

apply plugin: 'groovy'

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main/java', 'src/main/groovy']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = []
    test.groovy.srcDirs = ['src/test/groovy']
    test.resources.srcDirs = ['src/test/resources']
}

dependencies {
    api(project(':nf-commons'))
    api(project(':nf-httpfs'))
    api(project(':nf-lang'))
    api "org.apache.groovy:groovy:${groovyVersion}"
    api "org.apache.groovy:groovy-nio:${groovyVersion}"
    api "org.apache.groovy:groovy-xml:${groovyVersion}"
    api "org.apache.groovy:groovy-json:${groovyVersion}"
    api "org.apache.groovy:groovy-templates:${groovyVersion}"
    api "org.apache.groovy:groovy-yaml:${groovyVersion}"
    api "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
    api "org.slf4j:jul-to-slf4j:${slf4jVersion}"
    api "org.slf4j:log4j-over-slf4j:${slf4jVersion}"
    api "ch.qos.logback:logback-classic:${logbackVersion}"
    api "ch.qos.logback:logback-core:${logbackVersion}"
    api "org.codehaus.gpars:gpars:1.2.1"
    api("ch.artecat.grengine:grengine:3.0.2") { exclude group: 'org.codehaus.groovy' }
    api "org.apache.commons:commons-lang3:${commonsLang3Version}"
    api "commons-codec:commons-codec:1.15"
    api "commons-io:commons-io:2.15.1"
    api("com.esotericsoftware.kryo:kryo:${kryoVersion}") { exclude group: 'com.esotericsoftware.minlog', module: 'minlog' }
    api('org.iq80.leveldb:leveldb:0.12')
    api('org.eclipse.jgit:org.eclipse.jgit:7.1.1.202505221757-r')
    api ('javax.activation:activation:1.1.1')
    api ('javax.mail:mail:1.4.7')
    api ("org.yaml:snakeyaml:${snakeyamlVersion}")
    api ('org.jsoup:jsoup:1.23.2')
    api 'jline:jline:2.9'
    api "org.pf4j:pf4j:${pf4jVersion}"
    api "dev.failsafe:failsafe:${failsafeVersion}"
    api "io.seqera:lib-trace:${libTraceVersion}"
    api 'com.fasterxml.woodstox:woodstox-core:7.1.1'
    api 'org.apache.commons:commons-compress:1.27.1'  // For tar.gz extraction
    api "io.seqera:npr-api:${nprVersion}"
    api "io.seqera:npr-client:${nprVersion}"
    api 'com.networknt:json-schema-validator:1.5.9'

    testImplementation "org.subethamail:subethasmtp:${subethasmtpVersion}"
    testImplementation (project(':nf-lineage'))
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    // test configuration
    testFixturesApi ("org.apache.groovy:groovy-test:${groovyVersion}") { exclude group: 'org.apache.groovy' }
    testFixturesApi ("org.objenesis:objenesis:3.4")
    testFixturesApi ("net.bytebuddy:byte-buddy:1.14.17")
    testFixturesApi ("org.spockframework:spock-core:2.4-groovy-4.0") { exclude group: 'org.apache.groovy' }
    testFixturesApi ('org.spockframework:spock-junit4:2.4-groovy-4.0') { exclude group: 'org.apache.groovy' }
    testFixturesApi "com.google.jimfs:jimfs:${jimfsVersion}"
}

// The agent AST and its generated classes make this the heaviest Groovy compilation in the
// build, and the compiler daemon's 384m default is not enough for it. Kept per-module rather
// than raised globally: no other subproject needs it. The matching TEST heap bump this branch
// used to declare here is gone -- `Separate CLI from runtime` (#5971) sets minHeapSize and
// maxHeapSize for every subproject in the root build.gradle, at the same values.
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.forkOptions.memoryMaximumSize = '2048m'
}

apply plugin: 'groovy'

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = ['src/testResources']
}

dependencies {
    api(project(':nf-lang'))
    api "ch.qos.logback:logback-classic:${logbackVersion}"
    api "org.apache.groovy:groovy:${groovyVersion}"
    api "org.apache.groovy:groovy-nio:${groovyVersion}"
    api "org.apache.commons:commons-lang3:${commonsLang3Version}"
    api 'com.google.guava:guava:33.0.0-jre'
    api "org.pf4j:pf4j:${pf4jVersion}"
    api 'org.pf4j:pf4j-update:2.3.0'
    api "dev.failsafe:failsafe:${failsafeVersion}"
    api "io.seqera:lib-httpx:${libHttpxVersion}"
    api 'io.seqera:lib-util-net:0.2.0'
    api 'io.seqera:lib-retry:2.1.0'
    // patch gson dependency required by pf4j
    api "com.google.code.gson:gson:${gsonVersion}"
    api "io.seqera:npr-api:${nprVersion}"
    // jackson 2.21.5 addresses high-severity PolymorphicTypeValidator bypasses
    // (GHSA-rmj7-2vxq-3g9f, GHSA-j3rv-43j4-c7qm) and related @JsonView/@JsonIgnore
    // deserialization advisories; pinned here so it propagates to all downstream modules
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    /* testImplementation inherited from top gradle build file */
    testImplementation(testFixtures(project(":nextflow")))
    testFixturesImplementation(project(":nextflow"))

    testImplementation "org.apache.groovy:groovy-json:${groovyVersion}" // needed by wiremock
    testImplementation ("org.wiremock:wiremock-standalone:${wiremockVersion}") { exclude module: 'groovy-all' }
}

